plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.7.21'
    id 'application'

    id 'java-library'
    id 'java'
    id 'maven-publish'

    id 'com.github.johnrengelman.shadow' version '5.2.0'
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    main.java.srcDirs += 'src/main/kotlin'
}

//group = 'org.example'
version = '7.5-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = uri "https://oss.sonatype.org/content/repositories/snapshots/" }
    jcenter()
}

dependencies {
    api 'net.dv8tion:JDA:5.0.0-beta.2'
    implementation 'com.tfowl.ktor:ktor-jsoup:2.0.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.1-jre'

    implementation fileTree(dir: "libs", include: ["*.jar"])

    //implementation 'com.github.sapher:youtubedl-java:1.1'


    // https://mvnrepository.com/artifact/org.json/json
    implementation 'org.json:json:20220924'

    // https://mvnrepository.com/artifact/com.mashape.unirest/unirest-java
    implementation 'com.mashape.unirest:unirest-java:1.4.9'

    implementation 'com.rometools:rome:1.18.0'
    //implementation 'org.slf4j:slf4j-simple:2.0.3'
    api 'ch.qos.logback:logback-classic:1.3.0-alpha13'

    implementation group: 'org.springframework', name: 'spring-context', version: '5.3.23'
    testImplementation "org.jetbrains.kotlin:kotlin-script-runtime:1.7.10"

    implementation("it.skrape:skrapeit:0-SNAPSHOT")//{isChanging = true}
    //implementation "it.skrape:skrapeit:1.1.5"
    implementation "org.jsoup:jsoup:1.15.3"
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.7.21"
    // https://mvnrepository.com/artifact/it.marplex.cloudflarebypass/cloudflare-bypass
    implementation 'it.marplex.cloudflarebypass:cloudflare-bypass:1.0'
}

test {
    useJUnitPlatform()
}

compileKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

application {
    mainClassName = 'MainKt'
}
configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor(0, "seconds")
    }
}